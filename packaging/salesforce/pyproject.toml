[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sfdx-graphify"
dynamic = ["version"]
description = "Local Salesforce DX dependency analysis with traceable source evidence"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT", "NOTICE"]
dependencies = [
    "networkx>=3.4",
    "numpy>=1.21",
    "pathspec>=0.12,<2",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-language-pack==0.11.0",
]

[project.urls]
Repository = "https://github.com/jaldazvaldes/sfdx-graphify"

[project.scripts]
sfdx-graphify = "graphify.salesforce.cli:main"

[tool.setuptools]
packages = ["graphify", "graphify.extractors", "graphify.exporters", "graphify.salesforce"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "graphify.salesforce.schema.EXTRACTOR_VERSION"}

[tool.setuptools.package-data]
"graphify.salesforce" = ["viewer_static/*.html", "viewer_static/*.css", "viewer_static/*.js", "viewer_static/*.txt", "skills/sfdx-graphify/SKILL.md"]
