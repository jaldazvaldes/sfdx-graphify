[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sfdx-graphify"
dynamic = ["version"]
description = "Local Salesforce DX dependency analysis with traceable source evidence"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT", "NOTICE"]
dependencies = [
    # Preserve the Python 3.10 floor and NetworkX's CPython 3.14.1 exception.
    "networkx==3.4.2; python_version == '3.10' or python_full_version == '3.14.1'",
    "networkx==3.6.1; python_version == '3.11'",
    "networkx==3.7; python_version >= '3.12' and python_full_version != '3.14.1'",
    "numpy==2.2.6; python_version == '3.10'",
    "numpy==2.4.6; python_version == '3.11'",
    "numpy==2.5.4; python_version >= '3.12'",
    "pathspec==1.1.1",
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==0.11.0",
    "tree-sitter-c-sharp==0.23.5",
    "tree-sitter-embedded-template==0.25.0",
    "tree-sitter-yaml==0.7.2",
]

[project.urls]
Repository = "https://github.com/jaldazvaldes/sfdx-graphify"

[project.scripts]
sfdx-graphify = "graphify.salesforce.cli:main"

[tool.setuptools]
packages = ["graphify", "graphify.extractors", "graphify.exporters", "graphify.salesforce"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "graphify.salesforce.schema.EXTRACTOR_VERSION"}

[tool.setuptools.package-data]
"graphify.salesforce" = ["viewer_static/*.html", "viewer_static/*.css", "viewer_static/*.js", "viewer_static/*.txt", "skills/sfdx-graphify/SKILL.md"]
